# Delay installation of freshly published versions to reduce supply-chain risk
# from a compromised release: a version must be at least 7 days (10080 minutes)
# old before pnpm will install it. Security patches we deliberately pin through
# `pnpm.overrides` in package.json are unaffected once they clear this window.
minimumReleaseAge: 10080

# Operator-approved exception (2026-08-30): adopt Next.js 16.3.3 (published
# 2026-08-25) ahead of the window. Exact-version entries, so every later
# release still quarantines. Remove once 16.3.3 ages past the window
# (2026-09-01).
minimumReleaseAgeExclude:
  - next@16.3.3
  - eslint-config-next@16.3.3
  - "@next/playwright@16.3.3"
  # Operator-approved (2026-08-07): js-yaml 4.3.1 security patch adopted ~3h
  # before its window cleared (published 2026-07-31T17:39Z). Removable
  # immediately after 2026-08-07T17:39Z.
  - js-yaml@4.3.1
  # next's platform sub-packages, pinned to the same exact version (pnpm
  # rejects glob patterns with versions, but exact scoped entries work):
  - "@next/env@16.3.3"
  - "@next/eslint-plugin-next@16.3.3"
  - "@next/swc-darwin-arm64@16.3.3"
  - "@next/swc-darwin-x64@16.3.3"
  - "@next/swc-linux-arm64-gnu@16.3.3"
  - "@next/swc-linux-arm64-musl@16.3.3"
  - "@next/swc-linux-x64-gnu@16.3.3"
  - "@next/swc-linux-x64-musl@16.3.3"
  - "@next/swc-win32-arm64-msvc@16.3.3"
  - "@next/swc-win32-x64-msvc@16.3.3"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
