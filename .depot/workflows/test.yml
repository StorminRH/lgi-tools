# Depot CI — Origin PRs onto the train.
# GitHub Actions YAML on Depot compute. Not a GitHub Actions workflow.
# `verify`, `build`, and `e2e` start from `depot ci dispatch` only.

name: Verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6

      - uses: ./.depot/actions/setup-node-pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Lightweight presence gate (no build): every src/app route is classified
      # in route-classification.json and vice-versa. The full render-MODE assert
      # (assert:routes) needs `next build` and runs at deploy, so this catches a
      # route added or removed without its classification entry here in plain CI.
      - run: pnpm assert:routes-present

      # Durable org disk. Populate once (CCP zip + ingest + pg_dump -Fc);
      # later verify jobs restore into the empty sidecar. Keyed by CCP
      # sde_version + ingest-source hash. Public fork PRs skip the mount.
      - uses: depot/cache-mount@v1
        with:
          name: lgi-tools-sde-seed
          path: /mnt/sde-cache

      - run: pnpm db:migrate

      # Suites that clone from public.eve_* fail rather than skip without
      # this data. Restore records sde_version the same way ingest-sde does.
      - run: pnpm db:ci-sde-seed --cache-dir /mnt/sde-cache

      # Coverage-backed Vitest suite, including real-Postgres *.db.test.ts.
      # The fallow step below reads coverage/coverage-final.json for health/CRAP.
      - run: pnpm test:coverage

      # Whole-repo Fallow gate (dead code, duplication, architecture
      # boundaries, health). Inherited findings fail the same as new ones.
      - run: pnpm fallow

  # Production compile + render-mode classification. Laptops and
  # agents do not run `next build`. Cache `.next/cache` across PRs; do not
  # run `build:vercel` (no SDE ingest / warm-neon). Sidecar + migrate are
  # required because `generateStaticParams` for /sites/[id] reads `sites`.
  build:
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
      LOCAL_DB_DRIVER: postgres-js
      # betterAuth() constructs during `next build` page-data collection and
      # rejects the library default secret. Dummy values only.
      BETTER_AUTH_SECRET: e2e-ci-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - uses: ./.depot/actions/setup-node-pnpm

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            next-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm build

      - run: pnpm assert:routes

      # `.next` is a hidden directory; v4 skips those unless this is set.
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Playwright against `next start`. Reuses the `build` job's `.next`.
  # Playwright image already has OS deps + headless shell
  # (matches @playwright/test 1.62.1). Job-in-container reaches the
  # sidecar at hostname `postgres`, not localhost. LOCAL_DB_DRIVER selects
  # the TCP driver for `next start`; Redis degrade is the hosted-Vercel
  # predicate, so this flag is not a Redis signal. Leave it unset on
  # `verify` so neon-http timing tests keep seeing an unset driver.
  e2e:
    needs: [build]
    runs-on: depot-ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@postgres:5432/postgres
      LOCAL_DB_DRIVER: postgres-js
      BETTER_AUTH_SECRET: e2e-ci-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - uses: ./.depot/actions/setup-node-pnpm

      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            docs/ux-check/captures/playwright
            docs/ux-check/captures/e2e-report.json
          if-no-files-found: ignore
          retention-days: 7
