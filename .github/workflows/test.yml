# Manual pre-merge run. Typecheck, lint, static Fallow, and route
# presence run in `verify`. The production build runs in parallel, and
# e2e smoke follows the build. Tests
# with coverage and the coverage-backed Fallow gate run automatically on
# pull requests in Coverage health (coverage-health.yml). Do not invoke
# vercel-build / build:vercel. Starts only from Actions → Verify → Run
# workflow or `gh workflow run Verify`.

name: Verify
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm fallow:static

      - run: pnpm assert:routes-present

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
      LOCAL_DB_DRIVER: postgres-js
      BETTER_AUTH_SECRET: e2e-ci-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            next-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm build

      - run: pnpm assert:routes

      - name: Package production build
        run: |
          tar --exclude='.next/cache' --exclude='.next/dev' --exclude='.next/diagnostics' -czf "$RUNNER_TEMP/next-build.tgz" .next
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/next-build-subject.txt"
          du -b "$RUNNER_TEMP/next-build.tgz" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            ${{ runner.temp }}/next-build.tgz
            ${{ runner.temp }}/next-build-subject.txt
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@postgres:5432/postgres
      LOCAL_DB_DRIVER: postgres-js
      BETTER_AUTH_SECRET: e2e-ci-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: ${{ runner.temp }}

      - name: Restore this subject's production build
        run: |
          test "$(cat "$RUNNER_TEMP/next-build-subject.txt")" = "$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP/next-build.tgz"

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure
          path: |
            test-results
            test-results/e2e-report.json
          if-no-files-found: ignore
          retention-days: 7
