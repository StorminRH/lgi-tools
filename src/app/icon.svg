<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- A favicon renders isolated from the app stylesheet, so it cannot read the
       color tokens and has to restate them. Keep these in step with their
       owners: #060708 is color-bg-deep, #f1f5f9 is color-name (globals.css),
       #3dd68c is green in tones.ts. Wordmark matches the header [LGI] mark:
       green brackets letter-height and flush left/right, white LGI.
       The sibling favicon.ico carries the same mark for Safari before 26 and
       for clients that request /favicon.ico directly; regenerate both together. -->
  <rect width="32" height="32" fill="#060708"/>
  <path
    fill="#3dd68c"
    d="M0 9 H6.5 V11.25 H2.5 V21.75 H6.5 V24 H0 Z"
  />
  <path
    fill="#3dd68c"
    d="M32 9 H25.5 V11.25 H29.5 V21.75 H25.5 V24 H32 Z"
  />
  <text
    x="16"
    y="20.75"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="11"
    font-weight="800"
    letter-spacing="0.02em"
    fill="#f1f5f9"
  >LGI</text>
</svg>
